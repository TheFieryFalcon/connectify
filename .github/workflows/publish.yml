name: Publish Extension

on:
  push:
    branches:
      - '**'
    tags:
      - '**'
  workflow_dispatch:

jobs:
  build-and-publish:
    name: Build and Publish
    runs-on: ubuntu-latest
    permissions:
      contents: write

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Read version from manifest
        id: meta
        run: |
          VERSION=$(jq -r '.version // "unknown"' manifest.json)
          echo "version=$VERSION" >> "$GITHUB_OUTPUT"

      - name: Package Firefox .xpi
        run: |
          VERSION="${{ steps.meta.outputs.version }}"
          zip -r "connext-${VERSION}.xpi" . -x "*.git*" "*.github*" "*.DS_Store" "*_metadata*" "README.md" "ATAR-REFERENCE.md" "*.xpi" "*.zip" "*.crx"

      - name: Package Chrome .crx and .zip
        env:
          CRX_KEY_SECRET: ${{ secrets.CRX_KEY }}
        run: |
          VERSION="${{ steps.meta.outputs.version }}"
          mkdir -p /tmp/chrome-build
          rsync -av --exclude='.git*' --exclude='.github*' --exclude='*.xpi' --exclude='*.zip' --exclude='*.crx' \
            --exclude='_metadata*' --exclude='.DS_Store' --exclude='README.md' \
            --exclude='2.0.0_changelog.md' --exclude='ATAR-REFERENCE.md' ./ /tmp/chrome-build/

          if [ -n "$CRX_KEY_SECRET" ]; then
            echo "$CRX_KEY_SECRET" > /tmp/key.pem
          else
            openssl genrsa -out /tmp/key.pem 2048
          fi

          PUB_KEY=$(openssl rsa -in /tmp/key.pem -pubout -outform DER 2>/dev/null | base64 | tr -d '\r\n')
          jq --arg k "$PUB_KEY" 'del(.browser_specific_settings) | .key = $k' /tmp/chrome-build/manifest.json > /tmp/chrome-build/manifest.clean.json
          mv /tmp/chrome-build/manifest.clean.json /tmp/chrome-build/manifest.json

          npx -y crx3 -p /tmp/key.pem -o "connext-${VERSION}.crx" /tmp/chrome-build
          
          cd /tmp/chrome-build
          zip -r "$GITHUB_WORKSPACE/connext-${VERSION}.zip" .
          cd $GITHUB_WORKSPACE

      - name: Upload artifacts
        uses: actions/upload-artifact@v4
        with:
          name: connext-${{ steps.meta.outputs.version }}-builds
          path: |
            connext-${{ steps.meta.outputs.version }}.xpi
            connext-${{ steps.meta.outputs.version }}.crx
            connext-${{ steps.meta.outputs.version }}.zip

      - name: Publish to GitHub Release
        if: github.ref == 'refs/heads/main' || startsWith(github.ref, 'refs/tags/')
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          VERSION="${{ steps.meta.outputs.version }}"
          TAG_NAME="v${VERSION}"
          if [[ "${{ github.ref_type }}" == "tag" ]]; then
            TAG_NAME="${{ github.ref_name }}"
          fi

          PRERELEASE_FLAG=""

          if [[ "${{ github.ref_type }}" != "tag" ]]; then
            if gh release view "$TAG_NAME" >/dev/null 2>&1; then
              TIMECODE=$(git show -s --format=%ct ${{ github.sha }})
              TAG_NAME="${TAG_NAME}-${TIMECODE}"
              VERSION="${VERSION}-${TIMECODE}"
              PRERELEASE_FLAG="--prerelease"
              mv "connext-${{ steps.meta.outputs.version }}.xpi" "connext-${VERSION}.xpi"
              mv "connext-${{ steps.meta.outputs.version }}.crx" "connext-${VERSION}.crx"
              mv "connext-${{ steps.meta.outputs.version }}.zip" "connext-${VERSION}.zip"
            fi
          fi

          if gh release view "$TAG_NAME" >/dev/null 2>&1; then
            gh release upload "$TAG_NAME" "connext-${VERSION}.xpi" "connext-${VERSION}.crx" "connext-${VERSION}.zip" --clobber
          else
            gh release create "$TAG_NAME" "connext-${VERSION}.xpi" "connext-${VERSION}.crx" "connext-${VERSION}.zip" \
              --title "Connext ${TAG_NAME}" \
              --generate-notes $PRERELEASE_FLAG || gh release upload "$TAG_NAME" "connext-${VERSION}.xpi" "connext-${VERSION}.crx" "connext-${VERSION}.zip" --clobber
          fi

          if gh release view "latest" >/dev/null 2>&1; then
            gh release upload "latest" "connext-${VERSION}.xpi" "connext-${VERSION}.crx" "connext-${VERSION}.zip" --clobber
          else
            gh release create "latest" "connext-${VERSION}.xpi" "connext-${VERSION}.crx" "connext-${VERSION}.zip" \
              --title "Connext Latest Build" \
              --notes "Automated build from commit ${{ github.sha }} (version ${VERSION})" \
              --prerelease || gh release upload "latest" "connext-${VERSION}.xpi" "connext-${VERSION}.crx" "connext-${VERSION}.zip" --clobber
          fi
