name: Publish Chrome Build

on:
  push:
    branches:
      - '**'
    tags:
      - '**'
  workflow_dispatch:

jobs:
  build-and-publish-chrome:
    name: Build and Publish Chrome Extension
    runs-on: ubuntu-latest
    permissions:
      contents: write

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Read version from manifest
        id: meta
        run: |
          VERSION=$(jq -r '.version // "unknown"' manifest.json)
          echo "version=$VERSION" >> "$GITHUB_OUTPUT"
          echo "Building Chrome package for version: $VERSION"

      - name: Prepare Chrome extension and package .crx
        env:
          CRX_KEY_SECRET: ${{ secrets.CRX_KEY }}
        run: |
          VERSION="${{ steps.meta.outputs.version }}"
          mkdir -p /tmp/chrome-build
          rsync -av --exclude='.git*' --exclude='.github*' --exclude='*.xpi' --exclude='*.zip' --exclude='*.crx' \
            --exclude='_metadata*' --exclude='.DS_Store' --exclude='README.md' \
            --exclude='2.0.0_changelog.md' --exclude='ATAR-REFERENCE.md' ./ /tmp/chrome-build/

          # Prepare private key for CRX signing
          if [ -n "$CRX_KEY_SECRET" ]; then
            echo "$CRX_KEY_SECRET" > /tmp/key.pem
          else
            openssl genrsa -out /tmp/key.pem 2048
          fi

          # Derive public key and inject into manifest.json for Chrome identity matching
          PUB_KEY=$(openssl rsa -in /tmp/key.pem -pubout -outform DER 2>/dev/null | base64 | tr -d '\r\n')
          jq --arg k "$PUB_KEY" 'del(.browser_specific_settings) | .key = $k' /tmp/chrome-build/manifest.json > /tmp/chrome-build/manifest.clean.json
          mv /tmp/chrome-build/manifest.clean.json /tmp/chrome-build/manifest.json

          # Generate valid binary CRX3 package
          npx -y crx3 -p /tmp/key.pem -o "$GITHUB_WORKSPACE/connext-${VERSION}.crx" /tmp/chrome-build
          ls -lh "$GITHUB_WORKSPACE/connext-${VERSION}.crx"

      - name: Upload Chrome .crx artifact
        uses: actions/upload-artifact@v4
        with:
          name: connext-${{ steps.meta.outputs.version }}-crx
          path: connext-${{ steps.meta.outputs.version }}.crx
          if-no-files-found: error

      - name: Publish to GitHub Release
        if: github.ref == 'refs/heads/main' || startsWith(github.ref, 'refs/tags/')
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          VERSION="${{ steps.meta.outputs.version }}"
          TAG_NAME="v${VERSION}"
          if [[ "${{ github.ref_type }}" == "tag" ]]; then
            TAG_NAME="${{ github.ref_name }}"
          fi

          echo "Target release tag: $TAG_NAME"
          PRERELEASE_FLAG=""

          if gh release view "$TAG_NAME" >/dev/null 2>&1; then
            echo "Release $TAG_NAME exists, appending timecode..."
            TIMECODE=$(git show -s --format=%ct ${{ github.sha }})
            TAG_NAME="${TAG_NAME}-${TIMECODE}"
            VERSION="${VERSION}-${TIMECODE}"
            PRERELEASE_FLAG="--prerelease"
            mv "connext-${{ steps.meta.outputs.version }}.crx" "connext-${VERSION}.crx"
          fi

          if gh release view "$TAG_NAME" >/dev/null 2>&1; then
            echo "Release $TAG_NAME already exists, uploading Chrome assets..."
            gh release upload "$TAG_NAME" "connext-${VERSION}.crx" --clobber
          else
            echo "Creating release $TAG_NAME..."
            gh release create "$TAG_NAME" "connext-${VERSION}.crx" \
              --title "Connext ${TAG_NAME}" \
              --generate-notes $PRERELEASE_FLAG || gh release upload "$TAG_NAME" "connext-${VERSION}.crx" --clobber
          fi

          if gh release view "latest" >/dev/null 2>&1; then
            echo "Updating latest release with Chrome assets..."
            gh release upload "latest" "connext-${VERSION}.crx" --clobber
          else
            echo "Creating latest release..."
            gh release create "latest" "connext-${VERSION}.crx" \
              --title "Connext Latest Build" \
              --notes "Automated build from commit ${{ github.sha }} (version ${VERSION})" \
              --prerelease || gh release upload "latest" "connext-${VERSION}.crx" --clobber
          fi
