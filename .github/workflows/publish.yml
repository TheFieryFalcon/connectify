name: Publish Extension

on:
  push:
    branches:
      - '**'
    tags:
      - '**'
  workflow_dispatch:

jobs:
  build-and-publish:
    name: Build and Publish
    runs-on: ubuntu-latest
    permissions:
      contents: write

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Read version from manifest
        id: meta
        run: |
          VERSION=$(jq -r '.version // "unknown"' manifest.json)
          echo "version=$VERSION" >> "$GITHUB_OUTPUT"

      - name: Package Firefox .xpi
        run: |
          VERSION="${{ steps.meta.outputs.version }}"
          zip -r "connectify-${VERSION}.xpi" . -x "*.git*" "*.github*" "*.DS_Store" "*_metadata*" "README.md" "ATAR-REFERENCE.md" "*.xpi" "*.zip" "*.crx"

      - name: Package Chrome .crx and .zip
        env:
          CRX_KEY_SECRET: ${{ secrets.CRX_KEY }}
        run: |
          VERSION="${{ steps.meta.outputs.version }}"
          mkdir -p /tmp/chrome-build
          rsync -av --exclude='.git*' --exclude='.github*' --exclude='*.xpi' --exclude='*.zip' --exclude='*.crx' \
            --exclude='_metadata*' --exclude='.DS_Store' --exclude='README.md' \
            --exclude='2.0.0_changelog.md' --exclude='ATAR-REFERENCE.md' ./ /tmp/chrome-build/

          if [ -n "$CRX_KEY_SECRET" ]; then
            echo "$CRX_KEY_SECRET" > /tmp/key.pem
          else
            openssl genrsa -out /tmp/key.pem 2048
          fi

          PUB_KEY=$(openssl rsa -in /tmp/key.pem -pubout -outform DER 2>/dev/null | base64 | tr -d '\r\n')
          jq --arg k "$PUB_KEY" 'del(.browser_specific_settings) | .key = $k' /tmp/chrome-build/manifest.json > /tmp/chrome-build/manifest.clean.json
          mv /tmp/chrome-build/manifest.clean.json /tmp/chrome-build/manifest.json

          npx -y crx3 -p /tmp/key.pem -o "connectify-${VERSION}.crx" /tmp/chrome-build
          
          cd /tmp/chrome-build
          zip -r "$GITHUB_WORKSPACE/connectify-${VERSION}.zip" .
          cd $GITHUB_WORKSPACE

      - name: Upload artifacts
        uses: actions/upload-artifact@v4
        with:
          name: connectify-${{ steps.meta.outputs.version }}-builds
          path: |
            connectify-${{ steps.meta.outputs.version }}.xpi
            connectify-${{ steps.meta.outputs.version }}.crx
            connectify-${{ steps.meta.outputs.version }}.zip

      - name: Publish to GitHub Release
        if: github.ref == 'refs/heads/main' || startsWith(github.ref, 'refs/tags/')
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          VERSION="${{ steps.meta.outputs.version }}"
          TAG_NAME="v${VERSION}"
          if [[ "${{ github.ref_type }}" == "tag" ]]; then
            TAG_NAME="${{ github.ref_name }}"
          fi

          PRERELEASE_FLAG=""

          if [[ "${{ github.ref_type }}" != "tag" ]]; then
            if gh release view "$TAG_NAME" >/dev/null 2>&1; then
              TIMECODE=$(git show -s --format=%ct ${{ github.sha }})
              TAG_NAME="${TAG_NAME}-${TIMECODE}"
              VERSION="${VERSION}-${TIMECODE}"
              PRERELEASE_FLAG="--prerelease"
              mv "connectify-${{ steps.meta.outputs.version }}.xpi" "connectify-${VERSION}.xpi"
              mv "connectify-${{ steps.meta.outputs.version }}.crx" "connectify-${VERSION}.crx"
              mv "connectify-${{ steps.meta.outputs.version }}.zip" "connectify-${VERSION}.zip"
            fi
          fi

          if gh release view "$TAG_NAME" >/dev/null 2>&1; then
            gh release upload "$TAG_NAME" "connectify-${VERSION}.xpi" "connectify-${VERSION}.crx" "connectify-${VERSION}.zip" --clobber
          else
            gh release create "$TAG_NAME" "connectify-${VERSION}.xpi" "connectify-${VERSION}.crx" "connectify-${VERSION}.zip" \
              --title "Connectify ${TAG_NAME}" \
              --generate-notes $PRERELEASE_FLAG || gh release upload "$TAG_NAME" "connectify-${VERSION}.xpi" "connectify-${VERSION}.crx" "connectify-${VERSION}.zip" --clobber
          fi

          if gh release view "latest" >/dev/null 2>&1; then
            gh release upload "latest" "connectify-${VERSION}.xpi" "connectify-${VERSION}.crx" "connectify-${VERSION}.zip" --clobber
          else
            gh release create "latest" "connectify-${VERSION}.xpi" "connectify-${VERSION}.crx" "connectify-${VERSION}.zip" \
              --title "Connectify Latest Build" \
              --notes "Automated build from commit ${{ github.sha }} (version ${VERSION})" \
              --prerelease || gh release upload "latest" "connectify-${VERSION}.xpi" "connectify-${VERSION}.crx" "connectify-${VERSION}.zip" --clobber
          fi

      - name: Generate Auto-Update Manifests
        if: github.ref == 'refs/heads/main' || startsWith(github.ref, 'refs/tags/')
        run: |
          VERSION="${{ steps.meta.outputs.version }}"
          TAG_NAME="v${VERSION}"
          if [[ "${{ github.ref_type }}" == "tag" ]]; then
            TAG_NAME="${{ github.ref_name }}"
          fi
          
          # Generate Chrome updates.xml
          cat <<EOF > updates.xml
          <?xml version='1.0' encoding='UTF-8'?>
          <gupdate xmlns='http://www.google.com/update2/response' protocol='2.0'>
            <app appid='lkpdfanoafghlpacagkhepdklgagihnb'>
              <updatecheck codebase='https://github.com/TheFieryFalcon/connectify/releases/download/${TAG_NAME}/connectify-${VERSION}.crx' version='${VERSION}' />
            </app>
          </gupdate>
          EOF
          
          # Generate Firefox updates.json
          cat <<EOF > updates.json
          {
            "addons": {
              "connect-chart-tea@local": {
                "updates": [
                  {
                    "version": "${VERSION}",
                    "update_link": "https://github.com/TheFieryFalcon/connectify/releases/download/${TAG_NAME}/connectify-${VERSION}.xpi"
                  }
                ]
              }
            }
          }
          EOF
          
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add updates.xml updates.json
          git commit -m "chore: Update auto-update manifests for ${VERSION} [skip ci]" || echo "No changes to commit"
          git push origin HEAD:main
